# 上游服务器定义
upstream api_server {
    server localhost:3000;
    keepalive 32;
}

# HTTP 服务器配置 (80端口)
server {
    listen 80 default_server;
    server_name st-shortrange.quecinfo.com 10.55.132.116 localhost _;

    # 安全头设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 客户端上传限制
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # 日志配置
    access_log /var/log/nginx/api_server_access.log main;
    error_log /var/log/nginx/api_server_error.log warn;

    # 错误页面配置
    error_page 404 /errPage/maintenance.html;
    error_page 500 502 503 504 /errPage/maintenance.html;
    
    # 错误页面位置
    location = /errPage/maintenance.html {
        root /var/www/html;
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # favicon.ico 特殊处理
    location = /favicon.ico {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 静态文件缓存 (CSS, JS, 图片, 字体等)
    location ~* \.(css|js|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 缓存设置
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        
        # 压缩
        gzip_static on;
    }

    # API 路由 (包含所有API接口)
    location /api/ {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓存禁用 (API响应不缓存)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # WebDAV 路由
    location /webdav/ {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebDAV 特殊方法支持
        proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
        proxy_request_buffering off;
        
        # 超时设置 (文件上传可能需要更长时间)
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
 
    # 健康检查端点
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 主应用路由 (SPA支持)
    location / {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 对于SPA应用，处理路由重定向
        proxy_intercept_errors on;
        error_page 404 /errPage/maintenance.html;
    }
}
# HTTPS 重定向到 HTTP (443端口)
server {
    listen 443 ssl http2;
    server_name st-shortrange.quecinfo.com 10.55.132.116 localhost _;

    # SSL 证书配置（即使重定向也需要证书）
    ssl_certificate /usr/api_server/server/certs/st-shortrange.crt;
    ssl_certificate_key /usr/api_server/server/certs/st-shortrange.key;
    
    # SSL 基本配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # 重定向所有 HTTPS 请求到 HTTP
    return 301 http://$host$request_uri;
}
