# Nginx 多服务路径代理配置
# 域名: st-shortrange.quecinfo.com
# 用途: 通过路径前缀区分不同的后端服务
# 示例: 
#   https://st-shortrange.quecinfo.com/api/          -> API服务 (3000)
#   https://st-shortrange.quecinfo.com/service1/     -> 服务1 (3001)
#   https://st-shortrange.quecinfo.com/service2/     -> 服务2 (3002)

user www-data;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式 - 包含更多调试信息
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr time: $request_time';

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 上游服务器配置 - 定义你的所有后端服务
    # 主 API 服务
    upstream api_server {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # 青龙面板 - 定时任务管理
    upstream qinglong {
        server 127.0.0.1:5700 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # 1Panel - 服务器管理面板
    upstream onepanel {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # OpenList - 列表管理服务
    upstream openlist {
        server 127.0.0.1:9090 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # HTTP 服务器 - 重定向到 HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name st-shortrange.quecinfo.com;

        # 日志
        access_log /var/log/nginx/st-shortrange_http_access.log main;
        error_log /var/log/nginx/st-shortrange_http_error.log warn;

        # Let's Encrypt 验证路径（如果使用 certbot）
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # 其他所有请求重定向到 HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS 主服务器
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name st-shortrange.quecinfo.com;

        # SSL 证书配置（根据你的实际证书路径修改）
        ssl_certificate /usr/api_server/server/certs/server.crt;
        ssl_certificate_key /usr/api_server/server/certs/server.key;
        
        # 如果使用 Let's Encrypt:
        # ssl_certificate /etc/letsencrypt/live/st-shortrange.quecinfo.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/st-shortrange.quecinfo.com/privkey.pem;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS（严格传输安全）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 安全头设置
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 客户端限制
        client_max_body_size 100M;
        client_body_timeout 60s;
        client_header_timeout 60s;

        # 日志配置
        access_log /var/log/nginx/st-shortrange_ssl_access.log main;
        error_log /var/log/nginx/st-shortrange_ssl_error.log warn;

        # ========================================
        # 路径 1: /api/ - 主 API 服务
        # ========================================
        location /api/ {
            proxy_pass http://api_server;
            
            # 请求头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            
            # 禁用缓存
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # ========================================
        # 路径 2: /webdav/ - WebDAV 文件服务
        # ========================================
        location /webdav/ {
            proxy_pass http://api_server;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebDAV 特殊方法支持
            proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
            proxy_request_buffering off;
            
            # 更长的超时时间用于大文件上传
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # 支持的 HTTP 方法
            proxy_set_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PROPFIND, PROPPATCH, MKCOL, COPY, MOVE, LOCK, UNLOCK";
        }

        # ========================================
        # 路径 3: /qinglong/ - 青龙面板（定时任务管理）
        # ========================================
        location /qinglong/ {
            # 去掉路径前缀，让青龙接收原始路径
            proxy_pass http://qinglong/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /qinglong;
            
            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # ========================================
        # 路径 4: /1panel/ - 1Panel 服务器管理面板
        # ========================================
        location /1panel/ {
            # 去掉路径前缀
            proxy_pass http://onepanel/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /1panel;
            
            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # ========================================
        # 路径 5: /openlist/ - OpenList 列表管理服务
        # ========================================
        location /openlist/ {
            # 去掉路径前缀
            proxy_pass http://openlist/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /openlist;
            
            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        # ========================================
        # 静态资源缓存优化
        # ========================================
        location ~* \.(css|js|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            proxy_pass http://api_server;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 长期缓存
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            
            gzip_static on;
            access_log off;
        }

        # ========================================
        # favicon 特殊处理
        # ========================================
        location = /favicon.ico {
            proxy_pass http://api_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ========================================
        # 健康检查端点（不需要认证）
        # ========================================
        location = /health {
            access_log off;
            proxy_pass http://api_server;
            proxy_set_header Host $host;
        }

        # ========================================
        # 错误页面
        # ========================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /var/www/html;
            internal;
        }
        
        location = /50x.html {
            root /var/www/html;
            internal;
        }

        # ========================================
        # 主应用路由（Vue SPA）- 必须放在最后
        # ========================================
        location / {
            proxy_pass http://api_server;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # SPA 路由支持
            proxy_intercept_errors on;
        }
    }

    ##
    # 包含其他站点配置（如 teedoc、api-server 等）
    ##
    include /etc/nginx/sites-enabled/*;
}
